<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Basket - CarniBank</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>

<body class="m-0 overflow-hidden relative">

    <div class="panel-backdrop"></div>

    <aside class="basket-panel d-flex flex-column bg-white h-100 position-absolute top-0 end-0">
        
        <div class="d-flex align-items-center justify-content-between p-4 border-bottom position-sticky top-0 bg-white z-1">
            <h3 class="panel-title mb-0">Your Basket 🛒</h3>
            <a href="index.html" class="btn-close-panel d-flex align-items-center justify-content-center text-decoration-none">✕</a>
        </div>

        <div class="p-4 border-bottom">
            <label class="panel-label">PURCHASING AS</label>
            <select class="form-select custom-input">
                <option value="alex">Alex Butcher</option>
                <option value="maria">María García</option>
            </select>
        </div>

        <div class="p-4 flex-grow-1 overflow-auto">
            <div class="d-flex align-items-center justify-content-between mb-3">
                <label class="panel-label mb-0">ITEMS</label>
                <span class="badge rounded-pill bg-gold-subtle text-gold">Mixed Selection</span>
            </div>
            
            <div class="d-flex flex-column gap-3">
                <div class="basket-item d-flex align-items-center p-3 rounded-4">
                    <img src="https://images.pexels.com/photos/65175/pexels-photo-65175.jpeg?auto=compress&cs=tinysrgb&w=150" alt="Costilla de Res" class="basket-img rounded-3 me-3">
                    <div>
                        <h6 class="mb-0 fw-bold">Costilla de Res</h6>
                        <small class="text-secondary fw-medium">1x Unit</small>
                    </div>
                    <div class="ms-auto fw-bold text-dark fs-5">$24.90</div>
                </div>

                <div class="basket-item d-flex align-items-center p-3 rounded-4">
                    <img src="https://images.pexels.com/photos/60616/fried-chicken-chicken-fried-crunchy-60616.jpeg?auto=compress&cs=tinysrgb&w=150" alt="Orejas de Pollo" class="basket-img rounded-3 me-3">
                    <div>
                        <h6 class="mb-0 fw-bold">Orejas de Pollo</h6>
                        <small class="text-secondary fw-medium">1x Unit</small>
                    </div>
                    <div class="ms-auto fw-bold text-dark fs-5">$12.50</div>
                </div>
            </div>

            <div class="mt-4">
                <label class="panel-label">BUTCHER NOTES</label>
                <textarea class="form-control custom-input basket-item" rows="3" placeholder="Add a note for the butcher..."></textarea>
            </div>
        </div>

        <div class="p-4 bg-totals mt-auto rounded-top-4">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="text-secondary fw-medium">Subtotal</span>
                <span class="fw-bold text-dark">$37.40</span>
            </div>
            <hr class="my-3 text-secondary opacity-25">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="fs-5 fw-bold text-dark">Total Charge</span>
                <span class="total-price">$37.40</span>
            </div>

            <div class="balance-preview d-flex align-items-center gap-2 p-3 rounded-3 mb-4">
                <span>🏦</span>
                <span class="text-secondary" style="font-size: 13px;">Your balance: <strong class="text-dark">$1,240.00</strong></span>
            </div>

            <button class="btn btn-checkout w-100 py-3 rounded-3 mb-3">Confirm Purchase →</button>
            <p class="text-center text-secondary mb-0" style="font-size: 9px; font-weight: 700; letter-spacing: 0.5px;">SECURE TRANSACTION BY CARNIBANK™ CULINARY EQUITY</p>
        </div>
    </aside>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
