<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Basket - CarniBank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="m-0 overflow-hidden relative">

    <div class="panel-backdrop"></div>

    <aside class="basket-panel d-flex flex-column bg-white h-100 position-fixed top-0 end-0">

        <div class="d-flex align-items-center justify-content-between p-4 border-bottom position-sticky top-0 bg-white z-1">
            <h3 class="panel-title mb-0">Your Basket 🛒</h3>
            <a href="index.html" class="btn-close-panel d-flex align-items-center justify-content-center text-decoration-none">✕</a>
        </div>

        <div class="p-4 border-bottom">
            <label class="panel-label">PURCHASING AS</label>
            <div class="fw-bold" id="purchasingAs">---</div>
        </div>

        <div class="p-4 flex-grow-1 overflow-auto" id="cartItemsContainer">
            <div class="d-flex align-items-center justify-content-between mb-3">
                <label class="panel-label mb-0">ITEMS</label>
                <span class="badge rounded-pill bg-gold-subtle text-gold" id="itemCountBadge">0 items</span>
            </div>
            <div id="cartItems" class="d-flex flex-column gap-3">
                <div class="empty-cart">
                    <div class="empty-cart-icon">🛒</div>
                    <h5>Your cart is empty</h5>
                    <p class="text-secondary">Add some products from the catalog</p>
                    <a href="index.html" class="btn btn-outline-danger btn-sm mt-2">Browse Catalog</a>
                </div>
            </div>

            <div class="mt-4">
                <label class="panel-label">NOTES</label>
                <textarea class="form-control custom-input basket-item" id="purchaseNotes" rows="3" placeholder="Add a note..."></textarea>
            </div>
        </div>

        <div class="p-4 bg-totals mt-auto rounded-top-4">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="text-secondary fw-medium">Subtotal</span>
                <span class="fw-bold text-dark" id="subtotalDisplay">$0.00</span>
            </div>
            <div id="tamalbitPreview" class="d-none justify-content-between align-items-center mb-2">
                <span class="text-secondary fw-medium">⚡ Tamalbits to earn</span>
                <span class="fw-bold text-gold" id="tamalbitEarnDisplay">0</span>
            </div>
            <hr class="my-3 text-secondary opacity-25">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="fs-5 fw-bold text-dark">Total Charge</span>
                <span class="total-price" id="totalDisplay">$0.00</span>
            </div>

            <div class="balance-preview d-flex align-items-center gap-2 p-3 rounded-3 mb-4">
                <span>🏦</span>
                <span class="text-secondary" style="font-size: 13px;">Your balance: <strong class="text-dark" id="balancePreview">$--</strong></span>
            </div>

            <button class="btn btn-checkout w-100 py-3 rounded-3 mb-3" id="checkoutBtn">Confirm Purchase →</button>
            <p class="text-center text-secondary mb-0" style="font-size: 9px; font-weight: 700; letter-spacing: 0.5px;">
                SECURE TRANSACTION BY CARNIBANK&trade; CULINARY EQUITY
            </p>
        </div>
    </aside>

    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const personId = sessionStorage.getItem('personId');
            if (!personId) {
                window.location.href = 'login.html';
                return;
            }
            document.getElementById('purchasingAs').textContent = sessionStorage.getItem('personName') || personId;
            loadBalance();
            renderCart();
        });

        async function loadBalance() {
            const personId = sessionStorage.getItem('personId');
            try {
                const res = await fetch('/api/balance.php?person_id=' + encodeURIComponent(personId));
                const data = await res.json();
                if (data.balance !== undefined) {
                    document.getElementById('balancePreview').textContent = '$' + Number(data.balance).toFixed(2);
                }
            } catch (err) {
                console.error(err);
            }
        }

        function getCart() {
            try { return JSON.parse(localStorage.getItem('carnibank_cart')) || []; } catch { return []; }
        }

        function renderCart() {
            const cart = getCart();
            const container = document.getElementById('cartItems');
            const count = cart.reduce((s, i) => s + i.cantidad, 0);
            const total = cart.reduce((s, i) => s + i.precio * i.cantidad, 0);

            document.getElementById('itemCountBadge').textContent = count + ' item' + (count !== 1 ? 's' : '');
            document.getElementById('subtotalDisplay').textContent = '$' + total.toFixed(2);
            document.getElementById('totalDisplay').textContent = '$' + total.toFixed(2);

            const tamalbitTotal = cart
                .filter(i => i.es_tamalbit)
                .reduce((s, i) => s + Math.floor((i.precio * i.cantidad) / 10), 0);

            const tbPreview = document.getElementById('tamalbitPreview');
            if (tamalbitTotal > 0) {
                tbPreview.classList.remove('d-none');
                tbPreview.classList.add('d-flex');
                document.getElementById('tamalbitEarnDisplay').textContent = tamalbitTotal;
            } else {
                tbPreview.classList.add('d-none');
                tbPreview.classList.remove('d-flex');
            }

            if (cart.length === 0) {
                container.innerHTML = `
                        <div class="empty-cart">
                            <div class="empty-cart-icon">🛒</div>
                            <h5>Your cart is empty</h5>
                            <p class="text-secondary">Add some products from the catalog</p>
                            <a href="index.html" class="btn btn-outline-danger btn-sm mt-2">Browse Catalog</a>
                        </div>
                    `;
                document.getElementById('checkoutBtn').disabled = true;
                return;
            }

            document.getElementById('checkoutBtn').disabled = false;
            container.innerHTML = cart.map((item, idx) => `
                    <div class="basket-item d-flex align-items-center p-3 rounded-4">
                        <img src="${item.imagen || 'https://via.placeholder.com/48'}"
                            alt="${item.nombre}" class="basket-img rounded-3 me-3" onerror="this.src='https://via.placeholder.com/48'">
                        <div class="flex-grow-1">
                            <h6 class="mb-0 fw-bold">${item.nombre}</h6>
                            <small class="text-secondary fw-medium">${item.cantidad}x Unit${item.cantidad > 1 ? 's' : ''}</small>
                            ${item.es_tamalbit ? '<br><small class="text-gold fw-bold">⚡ Tamalbit eligible</small>' : ''}
                        </div>
                        <div class="text-end ms-2">
                            <div class="fw-bold text-dark fs-5">$${(item.precio * item.cantidad).toFixed(2)}</div>
                            <button class="btn btn-sm p-0 text-secondary" onclick="removeItem(${idx})">✕ remove</button>
                        </div>
                    </div>
                `).join('');
        }

        function removeItem(idx) {
            let cart = getCart();
            cart.splice(idx, 1);
            localStorage.setItem('carnibank_cart', JSON.stringify(cart));
            renderCart();
            if (cart.length === 0) {
                window.parent.document && tryUpdateFab();
            }
        }

        function tryUpdateFab() {
            try {
                if (window.parent && window.parent.updateFab) window.parent.updateFab();
            } catch (e) {}
        }

        document.getElementById('checkoutBtn').addEventListener('click', async function() {
            const cart = getCart();
            if (cart.length === 0) return;

            const btn = this;
            btn.disabled = true;
            btn.textContent = 'Processing...';

            const personId = sessionStorage.getItem('personId');
            const notes = document.getElementById('purchaseNotes').value.trim();

            try {
                const res = await fetch('/api/purchase.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        person_id: personId,
                        items: cart.map(i => ({
                            id_producto: i.id_producto,
                            nombre: i.nombre,
                            precio: i.precio,
                            cantidad: i.cantidad,
                        })),
                        notes: notes,
                    }),
                });
                const data = await res.json();

                if (data.success) {
                    localStorage.removeItem('carnibank_cart');
                    showToast('Purchase Successful! 🎉',
                        `$${data.totalDeducted.toFixed(2)} deducted. ${data.tamalbitsGanados > 0 ? data.tamalbitsGanados + ' Tamalbit(s) earned! 🌽' : ''}`,
                        'success');
                    btn.textContent = '✓ Done!';
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                } else {
                    showToast('Purchase Failed', data.error || 'Unknown error', 'error');
                    btn.disabled = false;
                    btn.textContent = 'Confirm Purchase →';
                }
            } catch (err) {
                showToast('Connection Error', 'Please try again', 'error');
                btn.disabled = false;
                btn.textContent = 'Confirm Purchase →';
            }
        });

        function showToast(title, msg, type) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast-custom ' + (type || '');
            toast.innerHTML = `
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <strong class="d-block">${title}</strong>
                            <small class="text-secondary">${msg}</small>
                        </div>
                        <button class="btn-close btn-close-sm" onclick="this.closest('.toast-custom').remove()"></button>
                    </div>
                `;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }
    </script>

</body>

</html>
