<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarniBank — Carniceria Premium</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="app-body">

    <header class="app-header sticky-top bg-white">
        <div class="container-fluid px-4 d-flex align-items-center justify-content-between h-100">
            <a href="index.html" class="d-flex align-items-center gap-2 text-decoration-none">
                <span class="fs-4">🥩</span>
                <span class="brand-name">CarniBank</span>
            </a>
            <div class="d-flex align-items-center gap-3">
                <div class="d-flex align-items-center gap-2">
                    <span class="user-name d-none d-sm-block" id="userNameDisplay">User</span>
                    <img src="https://i.pravatar.cc/150?u=user" alt="User" class="rounded-circle border" width="34" height="34" id="userAvatar">
                </div>
                <button class="btn-logout" id="logoutBtn" title="Logout">Logout</button>
            </div>
        </div>
    </header>

    <section class="bg-white py-3 border-bottom shadow-sm">
        <div class="container-fluid px-4">
            <div class="row g-3">

                <div class="col-md-6">
                    <div class="card card-balance border-0 h-100 p-4 position-relative overflow-hidden text-white">
                        <div class="d-flex align-items-center justify-content-between mb-2">
                            <span class="banner-label">AVAILABLE BALANCE</span>
                            <button class="btn-refresh rounded-circle p-1 z-1" id="refreshBtn" title="Actualizar">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                    <polyline points="23 4 23 10 17 10" />
                                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
                                </svg>
                            </button>
                        </div>
                        <div class="banner-amount z-1" id="balanceDisplay">$--</div>
                        <svg class="bg-watermark" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <rect x="2" y="5" width="20" height="14" rx="2" />
                            <path d="M2 10h20" />
                        </svg>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="card card-tamalbit border-0 h-100 p-4 text-white">
                        <div class="d-flex align-items-center justify-content-between mb-2">
                            <span class="banner-label">TAMALBITS EARNED</span>
                            <div class="tamalbit-icon fs-5">🌽</div>
                        </div>
                        <div class="d-flex align-items-center gap-2 mb-2">
                            <span class="fs-2 filter-shadow">⚡</span>
                            <span class="tamalbit-number" id="tamalbitDisplay">0</span>
                        </div>
                        <div class="hint-box mt-auto d-flex align-items-center gap-2">
                            <span>💡</span>
                            <span>Earn 1 Tamalbit per $10 spent on Orejas de Pollo</span>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <main class="container-fluid px-4 py-5">
        <div class="d-flex flex-column flex-md-row align-items-start align-items-md-center justify-content-between gap-3 mb-4">
            <div>
                <p class="catalog-subtitle mb-1">Seleccion del dia</p>
                <h2 class="catalog-title mb-0">Prime Selection</h2>
            </div>
            <div class="d-flex gap-2 flex-wrap" id="filterContainer">
            </div>
        </div>

        <div class="row g-4" id="productGrid">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-danger" role="status"></div>
                <p class="mt-2 text-secondary">Loading products...</p>
            </div>
        </div>
    </main>

    <footer class="bg-white border-top py-4 mt-auto">
        <div class="container-fluid px-4 d-flex flex-column flex-md-row align-items-center justify-content-between gap-2">
            <div class="d-flex align-items-center gap-2">
                <span>🥩</span>
                <span class="footer-brand">CarniBank</span>
            </div>
            <p class="footer-copy mb-0">&copy; 2026 CarniBank. Secure Culinary Equity.</p>
        </div>
    </footer>

    <button class="fab-cart" id="fabCart" onclick="goToCart()">
        <span class="fab-cart-icon">🛒</span>
        <span class="fab-cart-info">
            <span class="fab-cart-count" id="fabCount">0 Items</span>
            <span class="fab-cart-total" id="fabTotal">$0.00</span>
        </span>
    </button>

    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentFilter = 'Todos';
        let allProducts = [];

        document.addEventListener('DOMContentLoaded', () => {
            const personId = sessionStorage.getItem('personId');
            if (!personId) {
                window.location.href = 'login.html';
                return;
            }
            document.getElementById('userNameDisplay').textContent = sessionStorage.getItem('personName') || 'User';
            document.getElementById('userAvatar').src = 'https://i.pravatar.cc/150?u=' + encodeURIComponent(personId);

            loadBalance();
            loadProducts();
            updateFab();
        });

        document.getElementById('refreshBtn').addEventListener('click', loadBalance);
        document.getElementById('logoutBtn').addEventListener('click', () => {
            sessionStorage.clear();
            window.location.href = 'login.html';
        });

        async function loadBalance() {
            const personId = sessionStorage.getItem('personId');
            try {
                const res = await fetch('/api/balance.php?person_id=' + encodeURIComponent(personId));
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                document.getElementById('balanceDisplay').textContent = '$' + Number(data.balance).toFixed(2);
                document.getElementById('tamalbitDisplay').textContent = data.totalTamalbits;
            } catch (err) {
                console.error('Balance error:', err);
            }
        }

        async function loadProducts() {
            try {
                const res = await fetch('/api/products.php');
                const products = await res.json();
                allProducts = products;
                renderFilters(products);
                renderProducts(products);
            } catch (err) {
                document.getElementById('productGrid').innerHTML = `
                        <div class="col-12 text-center py-5">
                            <p class="text-secondary">Error loading products. Make sure the database is running.</p>
                        </div>
                    `;
            }
        }

        function renderFilters(products) {
            const cats = new Set();
            products.forEach(p => cats.add(p.categoria_nombre));
            const container = document.getElementById('filterContainer');
            container.innerHTML = '<button class="filter-btn active" data-filter="Todos">Todos</button>';
            cats.forEach(cat => {
                container.innerHTML += `<button class="filter-btn" data-filter="${cat}">${cat}</button>`;
            });
            container.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    container.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    renderProducts(allProducts);
                });
            });
        }

        function renderProducts(products) {
            const filtered = currentFilter === 'Todos' ? products : products.filter(p => p.categoria_nombre === currentFilter);
            const grid = document.getElementById('productGrid');
            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-12 text-center py-5"><p class="text-secondary">No products found.</p></div>`;
                return;
            }
            grid.innerHTML = filtered.map(p => {
                const cart = getCart();
                const inCart = cart.find(i => i.id_producto == p.id_producto);
                const qty = inCart ? inCart.cantidad : 1;
                const tamalbitBadge = p.es_tamalbit === 't' || p.es_tamalbit === true ? `<span class="badge badge-tamalbit">⚡ Tamalbit</span>` : '';
                const catClass = getCatClass(p.categoria_nombre);
                return `
                        <div class="col-sm-6 col-lg-4">
                            <div class="card product-card border-0 h-100 d-flex flex-column">
                                <div class="product-img-wrap">
                                    <img src="${p.imagen_url || 'https://via.placeholder.com/400x200?text=Product'}"
                                        alt="${p.nombre}" class="product-img" loading="lazy">
                                    ${tamalbitBadge}
                                </div>
                                <div class="card-body d-flex flex-column p-4">
                                    <div class="d-flex align-items-center justify-content-between mb-2">
                                        <span class="badge rounded-pill ${catClass.bg} ${catClass.text}">${p.categoria_nombre}</span>
                                        <span class="product-price">$${parseFloat(p.precio).toFixed(2)}</span>
                                    </div>
                                    <h5 class="product-name">${p.nombre}</h5>
                                    <p class="text-secondary small mb-2">${p.descripcion}</p>
                                    <div class="mt-auto pt-3 d-flex align-items-center justify-content-between">
                                        <div class="qty-control d-flex align-items-center">
                                            <button class="qty-btn" onclick="changeQty(${p.id_producto}, -1)">−</button>
                                            <span class="qty-value" id="qty-${p.id_producto}">${qty}</span>
                                            <button class="qty-btn" onclick="changeQty(${p.id_producto}, 1)">+</button>
                                        </div>
                                        <button class="btn btn-add-cart py-2 px-3" onclick="addToCart(${p.id_producto})">🛒 Add to Cart</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
            }).join('');
        }

        function getCatClass(cat) {
            const map = {
                'Cerdo': { bg: 'bg-cerdo-subtle', text: 'text-cerdo' },
                'Res': { bg: 'bg-res-subtle', text: 'text-res' },
                'Pollo': { bg: 'bg-embutidos-subtle', text: 'text-embutidos' },
                'Embutidos': { bg: 'bg-embutidos-subtle', text: 'text-embutidos' },
            };
            return map[cat] || { bg: 'bg-secondary-subtle', text: 'text-secondary' };
        }

        function changeQty(id, delta) {
            const span = document.getElementById('qty-' + id);
            let val = parseInt(span.textContent) + delta;
            if (val < 1) val = 1;
            span.textContent = val;
        }

        function getCart() {
            try { return JSON.parse(localStorage.getItem('carnibank_cart')) || []; } catch { return []; }
        }

        function saveCart(cart) {
            localStorage.setItem('carnibank_cart', JSON.stringify(cart));
            updateFab();
        }

        function addToCart(id) {
            const product = allProducts.find(p => p.id_producto == id);
            if (!product) return;
            const qty = parseInt(document.getElementById('qty-' + id).textContent);
            let cart = getCart();
            const existing = cart.find(i => i.id_producto == id);
            if (existing) {
                existing.cantidad += qty;
            } else {
                cart.push({
                    id_producto: product.id_producto,
                    nombre: product.nombre,
                    precio: parseFloat(product.precio),
                    cantidad: qty,
                    imagen: product.imagen_url,
                    categoria: product.categoria_nombre,
                    es_tamalbit: product.es_tamalbit === 't' || product.es_tamalbit === true,
                });
            }
            saveCart(cart);
            document.getElementById('qty-' + id).textContent = 1;
            showToast('Added to cart', `${product.nombre} x${qty}`, 'success');
        }

        function updateFab() {
            const cart = getCart();
            const count = cart.reduce((s, i) => s + i.cantidad, 0);
            const total = cart.reduce((s, i) => s + i.precio * i.cantidad, 0);
            document.getElementById('fabCount').textContent = count + ' Item' + (count !== 1 ? 's' : '');
            document.getElementById('fabTotal').textContent = '$' + total.toFixed(2);
            document.getElementById('fabCart').style.display = count > 0 ? 'flex' : 'none';
        }

        function goToCart() {
            window.location.href = 'panel.html';
        }

        function showToast(title, msg, type) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast-custom ' + (type || '');
            toast.innerHTML = `
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <strong class="d-block">${title}</strong>
                            <small class="text-secondary">${msg}</small>
                        </div>
                        <button class="btn-close btn-close-sm" onclick="this.closest('.toast-custom').remove()"></button>
                    </div>
                `;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>

</body>

</html>
